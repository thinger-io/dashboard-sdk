name: integration

# The SDK against real servers: the base version (Thinger 7.5) and the latest develop build, each
# a throwaway container with MongoDB (scripts/ci-server.sh). A function declared with
# @requiresServer is only expected to work on servers that meet its minimum.
on:
    push:
        branches: [main, develop]
    pull_request:
    schedule:
        - cron: '0 5 * * 1'
    workflow_dispatch:

jobs:
    docker:
        name: thinger/server:${{ matrix.tag }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                tag: ['7.5', 'develop']
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            # thinger/server:7.5 is published when 7.5 is tagged: until then this job says so
            # and passes
            - name: image available
              id: image
              run: |
                  if docker manifest inspect thinger/server:${{ matrix.tag }} >/dev/null 2>&1; then
                      echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::thinger/server:${{ matrix.tag }} is not published yet: skipped"
                      echo "available=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: install dependencies
              if: steps.image.outputs.available == 'true'
              run: npm ci

            - name: start the server
              if: steps.image.outputs.available == 'true'
              run: scripts/ci-server.sh thinger/server:${{ matrix.tag }} | sed 's/^export //' >> "$GITHUB_ENV"

            - name: integration tests
              if: steps.image.outputs.available == 'true'
              run: npm run test:integration

            - name: server logs
              if: failure() && steps.image.outputs.available == 'true'
              run: docker logs sdk-it-server 2>&1 | tail -200

    remote:
        # optional: a real server given by the repository secrets THINGER_SERVER / THINGER_TOKEN
        name: remote server
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: integration tests
              run: npm run test:integration
              env:
                  THINGER_SERVER: ${{ secrets.THINGER_SERVER }}
                  THINGER_TOKEN: ${{ secrets.THINGER_TOKEN }}
